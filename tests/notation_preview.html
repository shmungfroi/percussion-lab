<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudiment notation preview</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1d1d1b;
    background: #f6f4ef;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .controls label {
    margin-right: 14px;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card, 480px), 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid #d9d4c7;
    border-radius: 8px;
    padding: 12px 14px 10px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 6px;
  }
  .card h2 span {
    color: #7a7466;
    font-weight: 400;
  }
  .card code {
    display: block;
    font-size: 11px;
    color: #7a7466;
    margin-top: 6px;
    word-break: break-word;
  }
  body.dark {
    background: #1b1c1f;
    color: #ecebe6;
  }
  body.dark .card {
    background: #26282c;
    border-color: #3a3d42;
  }
  footer {
    max-width: 1100px;
    margin: 20px auto 0;
    color: #7a7466;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>The 40 International Drum Rudiments: notation preview</h1>
  <div class="controls">
    <label><input type="radio" name="w" value="480" checked> Desktop cards</label>
    <label><input type="radio" name="w" value="360"> Phone width (360px)</label>
    <label><input type="checkbox" id="dark"> Dark background (checks currentColor)</label>
  </div>
</header>
<main class="grid" id="grid"></main>
<footer id="credit"></footer>
<script src="../notation.js"></script>
<script>
  var grid = document.getElementById('grid');
  var q = new URLSearchParams(location.search);
  function draw() {
    if (!window.Rudiments) { grid.textContent = 'notation.js did not load.'; return; }
    var only = q.get('only');
    grid.innerHTML = Rudiments.list.filter(function (r) { return !only || String(r.n) === only; }).map(function (r) {
      return '<section class="card" id="r' + r.n + '"><h2>' + r.n + '. ' + r.name + ' <span>' + r.group + '</span></h2>' +
        Rudiments.svg(r.n) + '<code>' + Rudiments.describe(r.n) + '</code></section>';
    }).join('');
    document.getElementById('credit').textContent = Rudiments.credit;
  }
  function setW(w) {
    grid.style.setProperty('--card', w + 'px');
    grid.style.maxWidth = w == 360 ? '360px' : '';
  }
  document.querySelectorAll('input[name=w]').forEach(function (el) {
    el.addEventListener('change', function () { setW(el.value); });
  });
  document.getElementById('dark').addEventListener('change', function (e) { document.body.classList.toggle('dark', e.target.checked); });
  if (q.get('w')) { setW(q.get('w')); document.querySelector('input[value="' + q.get('w') + '"]') && (document.querySelector('input[value="' + q.get('w') + '"]').checked = true); }
  if (q.get('dark')) { document.body.classList.add('dark'); document.getElementById('dark').checked = true; }
  draw();
</script>
</body>
</html>
